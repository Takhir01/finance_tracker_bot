version: '3.8'

services:
  finance_bot:
    build: .
    container_name: finance_tracker_bot
    restart: always
    env_file:
      - .env
    volumes:
      - ./finance_bot.db:/app/finance_bot.db
      - ./downloads:/app/downloads
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
